// ---------- Extractive quick summary (fallback, no AI) ----------
function extractive(text, max = 2) {
  const sentences = text.replace(/\s+/g, " ").match(/[^.!?]+[.!?]+/g) || [text];
  if (sentences.length <= max) return text.trim();
  const words = text.toLowerCase().match(/[a-zà-ÿ]{4,}/g) || [];
  const freq = {};
  words.forEach(w => freq[w] = (freq[w] || 0) + 1);
  const scored = sentences.map((s, i) => {
    const sw = s.toLowerCase().match(/[a-zà-ÿ]{4,}/g) || [];
    let score = sw.reduce((a, w) => a + (freq[w] || 0), 0) / (sw.length || 1);
    if (i === 0) score *= 1.35; // lead bias
    return { s: s.trim(), i, score };
  });
  return scored.sort((a,b) => b.score - a.score).slice(0, max)
    .sort((a,b) => a.i - b.i).map(x => x.s).join(" ");
}

  // stats
  const total = posts.length;
  const unread = posts.filter(p => !store.read[p.id]).length;
  const high = posts.filter(p => p.relevance === "high" && !store.read[p.id]).length;
  $("#stats").innerHTML = `
    <div class="stat"><span class="n">${total}</span><span class="l">Signaux</span></div>
    <div class="stat ${unread ? "alert" : ""}"><span class="n">${unread}</span><span class="l">Non lus</span></div>
    <div class="stat"><span class="n">${high}</span><span class="l">Prio · non lus</span></div>`;

  // platform chips with counts
  const counts = { all: posts.length };
  Object.keys(PLATFORMS).forEach(k => counts[k] = posts.filter(p => p.platform === k).length);
  const chipHtml = [["all", "Tout"]].concat(Object.entries(PLATFORMS).map(([k,v]) => [k, v.label]))
    .map(([k, label]) => `<button class="chip" data-plat="${k}" aria-pressed="${state.platform===k}">${label} <span class="cnt">${counts[k]??0}</span></button>`)
    .join("");
  $("#platformChips").innerHTML = chipHtml;
  $("#platformChips").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    state.platform = c.dataset.plat; store.prefs.platform = state.platform; store.savePrefs(); render();
  });

  // filter chips reflect state
  $("#filterChips").querySelectorAll("[data-filter]").forEach(c => {
    c.setAttribute("aria-pressed", String(state[c.dataset.filter]));
    c.onclick = () => { state[c.dataset.filter] = !state[c.dataset.filter]; store.prefs[c.dataset.filter] = state[c.dataset.filter]; store.savePrefs(); render(); };
  });
  $("#sort").value = state.sort;

  // feed
  let list = posts.filter(matches);
  list.sort((a, b) => {
    if (state.sort === "date") return b.date.localeCompare(a.date);
    if (state.sort === "relevance") return (relRank[a.relevance]-relRank[b.relevance]) || b.date.localeCompare(a.date);
    if (state.sort === "platform") return a.platform.localeCompare(b.platform) || b.date.localeCompare(a.date);
    return 0;
  });

  const feed = $("#feed");
  if (!list.length) {
    feed.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <div>Aucun signal ne correspond à ces filtres.</div></div>`;
  } else {
    feed.innerHTML = list.map(card).join("");
    list.forEach(bindCard);
  }

  const shown = list.length;
  $("#foot").innerHTML = `${shown} / ${total} signaux affichés · dernière collecte ${DATA.meta.generated || "—"} · état lu/non-lu sauvegardé sur cet appareil`;
}

function card(p) {
  const pl = PLATFORMS[p.platform] || PLATFORMS.web;
  const isRead = !!store.read[p.id];
  const long = (p.content || "").length > 320;
  return `<article class="card rel-${p.relevance} ${isRead ? "read" : ""}" data-id="${p.id}">
    <div class="meta-row">
      ${isRead ? "" : '<span class="unread-dot" title="Non lu"></span>'}
      <span class="badge ${pl.badge}">${pl.label}</span>
      <span class="author">${esc(p.author)}</span>
      <span class="dot">·</span><span class="handle">${esc(p.handle||"")}</span>
      <span class="dot">·</span><span class="date">${fmtDate(p.date)}</span>
      <span class="topic">${esc(p.topic||"")}</span>
    </div>
    <h2>${esc(p.title)}</h2>
    <p class="summary"><span class="tag">Résumé IA</span>${esc(p.summary)}</p>
    <p class="full" id="full-${p.id}">${esc(p.content)}</p>
    <p class="quick" id="quick-${p.id}"></p>
    <div class="actions">
      <button class="act primary mark" aria-pressed="${isRead}">${isRead ? "✓ Lu" : "Marquer lu"}</button>
      <button class="act toggle">${long ? "Texte complet" : "Détails"}</button>
      <button class="act quickbtn" title="Résumé extractif instantané (sans IA)">Résumé rapide</button>
      <a class="act open-src" href="${esc(p.url)}" target="_blank" rel="noopener">Source
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    </div>
  </article>`;
}

function bindCard(p) {
  const el = document.querySelector(`.card[data-id="${p.id}"]`);
  if (!el) return;
  el.querySelector(".mark").onclick = () => {
    if (store.read[p.id]) delete store.read[p.id]; else store.read[p.id] = Date.now();
    store.saveRead(); render();
  };
  el.querySelector(".toggle").onclick = (e) => {
    const f = el.querySelector(".full"); f.classList.toggle("open");
    e.target.textContent = f.classList.contains("open") ? "Masquer" : ((p.content||"").length > 320 ? "Texte complet" : "Détails");
  };
  el.querySelector(".quickbtn").onclick = (e) => {
    const q = el.querySelector(".quick");
    if (q.classList.contains("open")) { q.classList.remove("open"); e.target.textContent = "Résumé rapide"; return; }
    q.innerHTML = `<span class="tag">Résumé rapide · extractif</span>${esc(extractive(p.content, 2))}`;
    q.classList.add("open"); e.target.textContent = "Masquer résumé";
  };
}

function esc(s) { return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// search debounce
let t;
$("#search").oninput = e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 140); };
$("#sort").onchange = e => { state.sort = e.target.value; store.prefs.sort = state.sort; store.savePrefs(); render(); };

if (DATA.meta && DATA.meta.owner) $("#sub").textContent = `Signaux IA · ${DATA.meta.owner}`;
render();
</script>
