<title>Nexus — Your second brain</title>
<style>
  :root{
    --bg:#0A0A0F; --surface:#12121A; --surface-2:#171722; --surface-3:#1E1E2B;
    --border:#1E1E2E; --border-2:#272736;
    --text:#F1F5F9; --text-2:#94A3B8; --muted:#64748B;
    --accent:#6366F1; --accent-2:#818CF8; --accent-soft:rgba(99,102,241,.14);
    --link:#22D3EE; --idea:#F59E0B; --success:#10B981; --yt:#F43F5E;
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --sb:248px;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--accent-soft)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#33334a}
  button{font-family:inherit;color:inherit;cursor:pointer}
  input,textarea{font-family:inherit;color:inherit}
  a{color:var(--accent-2);text-decoration:none}
  .tnum{font-variant-numeric:tabular-nums}
  svg{display:block}

  /* ---------- App shell ---------- */
  #app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:sticky;top:0;height:100vh;background:var(--surface);
    border-right:1px solid var(--border);display:flex;flex-direction:column;
    padding:18px 14px;gap:6px;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand .logo{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,var(--accent),#4f46e5);
    display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--accent);
  }
  .brand .logo svg{width:17px;height:17px}
  .brand .name{font-weight:700;font-size:16px;letter-spacing:-.02em}
  .brand .name span{color:var(--accent-2)}

  .sb-btn{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:9px 10px;border-radius:var(--radius-sm);border:1px solid transparent;
    background:transparent;color:var(--text-2);font-size:14px;font-weight:500;
    transition:background .12s,color .12s;
  }
  .sb-btn svg{width:18px;height:18px;flex:none;stroke-width:1.9}
  .sb-btn:hover{background:var(--surface-2);color:var(--text)}
  .sb-btn.active{background:var(--accent-soft);color:var(--text)}
  .sb-btn.active svg{color:var(--accent-2)}
  .sb-btn .kbd{margin-left:auto;font-size:11px;color:var(--muted);
    border:1px solid var(--border-2);border-radius:5px;padding:1px 5px}
  .sb-btn .count{margin-left:auto;font-size:12px;color:var(--muted)}

  .sb-search{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:9px 11px;border-radius:var(--radius-sm);
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--muted);font-size:13.5px;margin-bottom:2px;
  }
  .sb-search svg{width:16px;height:16px}
  .sb-search .kbd{margin-left:auto;font-size:11px;border:1px solid var(--border-2);
    border-radius:5px;padding:1px 5px}
  .sb-search:hover{border-color:var(--border-2);color:var(--text-2)}

  .capture-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:10px;border-radius:var(--radius-sm);border:none;
    background:linear-gradient(145deg,var(--accent),#4f46e5);color:#fff;
    font-weight:600;font-size:14px;margin:4px 0 12px;
    box-shadow:0 8px 20px -10px var(--accent);transition:transform .1s,filter .12s;
  }
  .capture-btn:hover{filter:brightness(1.08)}
  .capture-btn:active{transform:translateY(1px)}
  .capture-btn svg{width:17px;height:17px;stroke-width:2.3}

  .sb-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);padding:14px 10px 6px}
  .sb-scroll{overflow-y:auto;flex:1;margin:0 -6px;padding:0 6px}
  .tag-row{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;
    color:var(--text-2);font-size:13.5px;cursor:pointer}
  .tag-row:hover{background:var(--surface-2);color:var(--text)}
  .tag-row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .tag-row .count{margin-left:auto;font-size:12px;color:var(--muted)}

  .sb-foot{border-top:1px solid var(--border);padding-top:10px;margin-top:6px;
    display:flex;flex-direction:column;gap:2px}
  .sb-stat{font-size:12px;color:var(--muted);padding:4px 10px;display:flex;justify-content:space-between}

  /* ---------- Main ---------- */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .content{max-width:820px;width:100%;margin:0 auto;padding:34px 28px 90px}

  .page-head{margin-bottom:22px}
  .greeting{font-size:26px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
  .greeting .accent{color:var(--accent-2)}
  .sub{color:var(--text-2);margin-top:4px;font-size:14.5px}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
  .page-title .badge{font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);
    border:1px solid var(--border);padding:3px 9px;border-radius:20px}

  /* Quick capture */
  .capture{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:4px;margin-bottom:26px;transition:border-color .15s,box-shadow .15s;
  }
  .capture.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .capture textarea{
    width:100%;border:none;background:transparent;resize:none;outline:none;
    padding:12px 13px 4px;font-size:15px;line-height:1.55;min-height:26px;
  }
  .capture textarea::placeholder{color:var(--muted)}
  .capture-bar{display:flex;align-items:center;gap:8px;padding:6px 8px 8px}
  .capture-bar .hint{font-size:12px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:7px}
  .chip-select{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);
    background:var(--surface-2);border:1px solid var(--border);border-radius:20px;
    padding:5px 11px;cursor:pointer;transition:border-color .12s}
  .chip-select:hover{border-color:var(--border-2)}
  .chip-select .dot{width:7px;height:7px;border-radius:50%}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);transition:all .12s}
  .icon-btn:hover{color:var(--text);border-color:var(--border-2)}
  .icon-btn svg{width:16px;height:16px}
  .save-btn{padding:8px 16px;border-radius:8px;border:none;font-weight:600;font-size:13.5px;
    background:var(--accent);color:#fff;transition:filter .12s,opacity .12s}
  .save-btn:hover{filter:brightness(1.1)}
  .save-btn:disabled{opacity:.4;cursor:default;filter:none}

  /* Section */
  .section{margin-bottom:30px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .section-head h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
  .section-head .line{flex:1;height:1px;background:var(--border)}
  .section-head .link{font-size:12.5px;color:var(--muted);cursor:pointer}
  .section-head .link:hover{color:var(--accent-2)}

  /* Digest cards */
  .digest-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .digest-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
  }
  .digest-card .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:4px}
  .digest-card .ic svg{width:16px;height:16px}
  .digest-card h3{font-size:14px;font-weight:600}
  .digest-card p{font-size:13px;color:var(--text-2);margin:0}
  .digest-card .act{font-size:12.5px;color:var(--accent-2);margin-top:auto;padding-top:8px;cursor:pointer}

  /* Note cards */
  .feed{display:flex;flex-direction:column;gap:11px}
  .note{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    border-left:3px solid var(--accent);padding:14px 16px;cursor:pointer;
    transition:border-color .13s,transform .1s,background .13s;position:relative;
  }
  .note:hover{border-color:var(--border-2);background:var(--surface-2)}
  .note:hover{border-left-color:inherit}
  .note.t-link{border-left-color:var(--link)}
  .note.t-idea{border-left-color:var(--idea)}
  .note.t-youtube{border-left-color:var(--yt)}
  .note.t-text{border-left-color:var(--accent)}
  .note-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .note-type{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
  .note-type svg{width:13px;height:13px}
  .note-title{font-weight:600;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-time{font-size:12px;color:var(--muted);flex:none}
  .note-summary{font-size:13.5px;color:var(--text-2);margin:2px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note-foot{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
  .tag{font-size:11.5px;color:var(--accent-2);background:var(--accent-soft);
    padding:2px 9px;border-radius:20px}
  .note-proj{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-left:auto}
  .note-proj .dot{width:6px;height:6px;border-radius:50%}
  .note-host{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .note-host svg{width:12px;height:12px}

  /* Projects grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
  .proj-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;cursor:pointer;transition:transform .1s,border-color .13s;
  }
  .proj-card:hover{border-color:var(--border-2);transform:translateY(-2px)}
  .proj-card .ptop{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .proj-card .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .proj-card h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .proj-card .pmeta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .status{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border-2);color:var(--text-2)}
  .status.active{color:var(--success);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}

  /* Empty */
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty svg{width:40px;height:40px;margin:0 auto 14px;opacity:.5;stroke-width:1.5}
  .empty h3{color:var(--text-2);font-size:15px;font-weight:600;margin-bottom:5px}
  .empty p{font-size:13.5px;max-width:300px;margin:0 auto}

  /* Filter pills */
  .pills{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pill{font-size:13px;padding:6px 13px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-2);transition:all .12s}
  .pill:hover{border-color:var(--border-2);color:var(--text)}
  .pill.active{background:var(--accent-soft);border-color:transparent;color:var(--text)}

  /* ---------- Overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(5,5,10,.6);
    backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
  .overlay.open{display:flex}
  .overlay.center{align-items:center;padding:16px}

  /* Command palette */
  .palette{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--border-2);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
  .pal-input{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
  .pal-input svg{width:19px;height:19px;color:var(--muted);flex:none}
  .pal-input input{flex:1;border:none;background:transparent;outline:none;font-size:16px}
  .pal-input .esc{font-size:11px;color:var(--muted);border:1px solid var(--border-2);border-radius:5px;padding:2px 6px}
  .pal-results{max-height:52vh;overflow-y:auto;padding:8px}
  .pal-group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);padding:10px 10px 5px}
  .pal-item{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:9px;cursor:pointer}
  .pal-item.sel,.pal-item:hover{background:var(--surface-2)}
  .pal-item .pic{width:30px;height:30px;border-radius:7px;background:var(--surface-3);
    display:grid;place-items:center;flex:none;color:var(--text-2)}
  .pal-item .pic svg{width:15px;height:15px}
  .pal-item .pt{flex:1;min-width:0}
  .pal-item .pt .l1{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pal-item .pt .l2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pal-empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}
  .pal-foot{border-top:1px solid var(--border);padding:9px 14px;display:flex;gap:16px;
    font-size:11.5px;color:var(--muted)}
  .pal-foot span{display:flex;align-items:center;gap:5px}
  .pal-foot .k{border:1px solid var(--border-2);border-radius:4px;padding:0 5px;font-size:11px}

  /* Modal (note / project) */
  .modal{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--border-2);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);max-height:84vh;display:flex;flex-direction:column;animation:pop .16s ease}
  .modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
  .modal-head .mtype{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .modal-head .mtype svg{width:16px;height:16px}
  .modal-head h2{flex:1;font-size:17px;font-weight:600;letter-spacing:-.015em;min-width:0}
  .modal-head input{flex:1;font-size:17px;font-weight:600;background:transparent;border:none;outline:none}
  .modal-x{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);
    border:1px solid transparent;background:transparent}
  .modal-x:hover{background:var(--surface-2);color:var(--text)}
  .modal-x svg{width:16px;height:16px}
  .modal-body{padding:16px 20px;overflow-y:auto}
  .modal-body textarea{width:100%;min-height:160px;background:transparent;border:none;outline:none;
    resize:vertical;font-size:14.5px;line-height:1.65;color:var(--text)}
  .modal-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--link);
    background:rgba(34,211,238,.08);padding:7px 12px;border-radius:8px;margin-bottom:14px;word-break:break-all}
  .modal-link svg{width:14px;height:14px;flex:none}
  .meta-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .modal-foot{padding:13px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .modal-foot .meta{font-size:12px;color:var(--muted);margin-right:auto}
  .btn-ghost{padding:8px 14px;border-radius:8px;border:1px solid var(--border-2);background:transparent;
    color:var(--text-2);font-size:13px;font-weight:500;transition:all .12s}
  .btn-ghost:hover{color:var(--text);border-color:#3a3a52}
  .btn-ghost.danger:hover{color:#f87171;border-color:rgba(248,113,113,.4)}
  .btn-solid{padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;
    font-size:13px;font-weight:600}
  .btn-solid:hover{filter:brightness(1.1)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;letter-spacing:.02em}
  .field input,.field select{width:100%;padding:10px 12px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--border);outline:none;font-size:14px}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .swatches{display:flex;gap:9px}
  .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .swatch.sel{border-color:var(--text);transform:scale(1.1)}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface-3);border:1px solid var(--border-2);border-radius:10px;
    padding:11px 18px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;color:var(--success)}

  /* Project dropdown menu */
  .menu{position:absolute;background:var(--surface-3);border:1px solid var(--border-2);border-radius:10px;
    box-shadow:var(--shadow);padding:6px;z-index:120;min-width:190px;max-height:280px;overflow-y:auto}
  .menu-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:13.5px;cursor:pointer}
  .menu-item:hover{background:var(--surface)}
  .menu-item .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .hamb{display:none}

  /* ---------- Responsive ---------- */
  @media(max-width:760px){
    #app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;
      background:rgba(10,10,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:30}
    .hamb{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;
      background:var(--surface);border:1px solid var(--border);color:var(--text)}
    .hamb svg{width:18px;height:18px}
    .topbar .tb-brand{font-weight:700;font-size:15px}
    .topbar .tb-brand span{color:var(--accent-2)}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
    .scrim.open{display:block}
    .content{padding:22px 16px 90px}
    .greeting{font-size:22px}
    .digest-row{grid-template-columns:1fr}
    .overlay{padding:8vh 12px 12px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo" id="ic-logo"></div>
      <div class="name">NE<span>XUS</span></div>
    </div>
    <button class="sb-search" data-action="search">
      <span id="ic-s1"></span><span>Search everything…</span>
      <span class="kbd">⌘K</span>
    </button>
    <button class="capture-btn" data-action="focus-capture">
      <span id="ic-plus"></span> Capture a thought
    </button>
    <nav id="nav"></nav>
    <div class="sb-label">Tags</div>
    <div class="sb-scroll" id="tags"></div>
    <div class="sb-foot">
      <button class="sb-btn" data-view="settings"><span id="ic-set"></span> Settings</button>
      <div class="sb-stat"><span id="stat-notes">0 notes</span><span id="stat-days"></span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="close-sidebar"></div>

  <main class="main">
    <div class="topbar">
      <button class="hamb" data-action="open-sidebar"><span id="ic-menu"></span></button>
      <div class="tb-brand">NE<span>XUS</span></div>
      <button class="hamb" data-action="search" style="margin-left:auto"><span id="ic-s2"></span></button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Command palette -->
<div class="overlay" id="palette-ov">
  <div class="palette" role="dialog" aria-label="Search">
    <div class="pal-input">
      <span id="ic-s3"></span>
      <input id="pal-q" placeholder="Search notes, projects, tags…" autocomplete="off"/>
      <span class="esc">esc</span>
    </div>

};

/* ------------------------------------------------------------------ state */
const KEY='nexus_v1';

function save(){localStorage.setItem(KEY,JSON.stringify(state))}

    n({title:'Ideal client profile',content:"Revenue $10M-$50M. 50-300 employees. NO CTO — that's the key gap. Industries: construction, manufacturing, professional services, real estate, healthcare practices. The one still running everything on Excel.",tags:['sales','targeting'],projectId:'p1',createdAt:now-27*D}),

    n({title:'LinkedIn connection script',content:"\"Hey [Name], I help companies like yours implement AI to save money and stay ahead of the competition. Would love to connect.\"\n\nFollow-up: reference something specific about their business + \"we're helping [industry] automate [function] and save 20-30% on ops. Worth a 15-min call?\"",tags:['marketing','scripts'],projectId:'p3',createdAt:now-6*D}),
    n({title:'Quebec market angle',content:"French-first marketing. Lean on local directories and warm referrals — Quebec business is relationship-driven. Position as \"votre CAIO fractionnaire\".",tags:['marketing','quebec'],projectId:'p3',createdAt:now-3*D}),
    n({title:'The one-liner that sells',content:"We don't sell software. We sell a transformation — the peace of mind that you're not falling behind on AI, without paying $250K/yr for a CTO.",tags:['sales','framework'],projectId:'p1',createdAt:now-1*D}),
  ];
  return {notes,projects:p,settings:{},meta:{created:now}};
}

state=load()||seed();
if(!load())save();

/* ------------------------------------------------------------------ utils */
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUrl=(s)=>/^(https?:\/\/|www\.)\S+$/i.test(s.trim());
function host(u){try{return new URL(u.startsWith('http')?u:'https://'+u).hostname.replace(/^www\./,'')}catch(e){return u}}
function timeAgo(t){
  const s=(Date.now()-t)/1000;
  if(s<60)return'just now';
  const m=s/60;if(m<60)return Math.floor(m)+'m ago';
  const h=m/60;if(h<24)return Math.floor(h)+'h ago';
  const d=h/24;if(d<7)return Math.floor(d)+'d ago';
  if(d<30)return Math.floor(d/7)+'w ago';
  if(d<365)return Math.floor(d/30)+'mo ago';
  return Math.floor(d/365)+'y ago';
}
const projById=(id)=>state.projects.find(p=>p.id===id);
function noteIcon(t){return t==='link'?I.link:t==='idea'?I.idea:t==='youtube'?I.play:I.text}
function typeColor(t){return t==='link'?'var(--link)':t==='idea'?'var(--idea)':t==='youtube'?'var(--yt)':'var(--accent)'}
function allTags(){
  const m={};state.notes.forEach(n=>n.tags.forEach(t=>m[t]=(m[t]||0)+1));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function summarize(n){
  if(n.type==='link'&&!n.content)return n.url;
  return (n.content||'').replace(/\n+/g,' ').trim();
}

/* ------------------------------------------------------------------ CRUD */
function addNote(raw){
  const text=raw.trim();if(!text)return null;
  const tags=[...new Set((text.match(/#[\w-]+/g)||[]).map(t=>t.slice(1).toLowerCase()))];
  let body=text.replace(/\s*#[\w-]+/g,'').trim()||text;
  const firstLine=body.split('\n')[0].trim();
  let type=ui.capType,url='',title,content;
  if(isUrl(firstLine)){
    type='link';url=firstLine;
    const rest=body.split('\n').slice(1).join('\n').trim();
    title=rest?rest.split('\n')[0].slice(0,80):host(url);
    content=rest;
  }else{
    title=firstLine.slice(0,80);
    content=body;
  }
  const note={id:uid(),type,title:title||'Untitled',content,url,tags,
    projectId:ui.capProj,createdAt:Date.now(),updatedAt:Date.now()};
  state.notes.unshift(note);save();
  ui.capType='text';ui.capProj=null;
  return note;
}
function updateNote(id,patch){const n=state.notes.find(x=>x.id===id);if(n){Object.assign(n,patch,{updatedAt:Date.now()});save()}}
function deleteNote(id){state.notes=state.notes.filter(n=>n.id!==id);save()}
function addProject(name,color){const p={id:uid(),name:name.trim(),color,status:'active',createdAt:Date.now()};state.projects.push(p);save();return p}

/* ------------------------------------------------------------------ render */
const $=(s)=>document.querySelector(s);
const content=$('#content');

function render(){renderSidebar();renderMain();}

function renderSidebar(){
  const nav=$('#nav');

  const items=[['home','Home',I.home],['notes','All notes',I.note],['learn','Learn',I.play],['projects','Projects',I.folder]];

    const c=v==='notes'?state.notes.length:v==='projects'?state.projects.length:v==='learn'?ytCount:'';
    return `<button class="sb-btn ${ui.view===v&&!ui.tag?'active':''}" data-view="${v}">${ic}<span>${l}</span>${c!==''?`<span class="count tnum">${c}</span>`:''}</button>`;
  }).join('');
  const tags=allTags();
  $('#tags').innerHTML=tags.length?tags.map(([t,c])=>
    `<div class="tag-row ${ui.tag===t?'active':''}" data-tag="${esc(t)}"><span class="dot" style="background:${PC[hashc(t)%PC.length]}"></span><span>${esc(t)}</span><span class="count tnum">${c}</span></div>`
  ).join(''):'<div style="padding:6px 10px;font-size:12.5px;color:var(--muted)">No tags yet</div>';
  $('#stat-notes').textContent=state.notes.length+(state.notes.length===1?' note':' notes');
  const days=Math.max(1,Math.floor((Date.now()-state.meta.created)/864e5));
  $('#stat-days').textContent=days+'d active';
}
function hashc(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}

function renderMain(){
  if(ui.tag)return renderTag();
  ({home:renderHome,notes:renderNotes,learn:renderLearn,projects:renderProjects,project:renderProject,settings:renderSettings}[ui.view]||renderHome)();
}

function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}

function renderHome(){
  const recent=state.notes.slice(0,6);
  const old=state.notes.filter(n=>Date.now()-n.createdAt>14*864e5);
  const resurface=old.length?old[Math.floor((Date.now()/864e5)%old.length)]:null;
  const today=state.notes.filter(n=>Date.now()-n.createdAt<864e5).length;
  content.innerHTML=`
    <div class="page-head">
      <div class="greeting">${greeting()}, Michel. <span class="accent">Here's what matters.</span></div>

          <div class="ic" style="background:var(--accent-soft);color:var(--accent-2)">${I.sparkle}</div>

          <div class="act" data-action="search">Try it →</div>

          <div class="ic" style="background:rgba(245,158,11,.12);color:var(--idea)">${I.clock}</div>

        <div class="digest-card">
          <div class="ic" style="background:rgba(16,185,129,.12);color:var(--success)">${I.bolt}</div>

function renderTag(){

function renderProjects(){

/* --------- YouTube → Brain module --------- */
function getLearnProject(){
  let p=state.projects.find(x=>x.name==='Learning');
  if(!p)p=addProject('Learning','#F43F5E');
  return p;
}
function extractYT(text){
  const vids=new Set(),lists=new Set();
  (text.match(/\S+/g)||[]).forEach(tok=>{
    let m;
    if(m=tok.match(/[?&]list=([\w-]+)/))lists.add(m[1]);
    if(m=tok.match(/[?&]v=([\w-]{11})/))vids.add(m[1]);
    else if(m=tok.match(/youtu\.be\/([\w-]{11})/))vids.add(m[1]);
    else if(m=tok.match(/\/shorts\/([\w-]{11})/))vids.add(m[1]);
    else if(m=tok.match(/\/embed\/([\w-]{11})/))vids.add(m[1]);
  });
  return {vids:[...vids],lists:[...lists]};
}
function addYT(id){
  if(state.notes.some(n=>n.videoId===id))return false;
  const now=Date.now();
  state.notes.unshift({id:uid(),type:'youtube',videoId:id,
    url:'https://www.youtube.com/watch?v='+id,title:'YouTube video ('+id+')',
    content:'',transcript:'',status:'pending',tags:['youtube'],
    projectId:getLearnProject().id,createdAt:now,updatedAt:now});
  return true;
}

  content.innerHTML=`

      <textarea id="yt-in" rows="2" placeholder="Paste video URLs (one per line) or a playlist link…"></textarea>
      <div class="capture-bar"><div class="hint">${I.play}<span>Public playlist or video links</span></div>
        <button class="save-btn" id="yt-save" disabled>Add to queue</button></div>
    </div>
    <div class="digest-card" style="margin-bottom:26px">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div class="ic" style="background:rgba(244,63,94,.12);color:var(--yt);flex:none;margin:0">${I.play}</div>
        <div><h3 style="margin-bottom:4px">How it works</h3>
        <p style="line-height:1.6">1 · Queue videos here.&nbsp; 2 · Open each → paste its transcript (YouTube: “…” → Show transcript → copy).&nbsp; 3 · Export the queue.&nbsp; 4 · Your agent writes an expert synthesis from the real transcript.&nbsp; 5 · Import it back — it lands in your brain.</p></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <button class="btn-ghost" data-action="yt-export">Export queue (.json)</button>
        <button class="btn-ghost" data-action="yt-import">Import syntheses (.json)</button>
      </div>
    </div>
    ${pending.length?sh('Queue — awaiting synthesis')+'<div class="feed" style="margin-bottom:28px">'+pending.map(ytCard).join('')+'</div>':''}
    ${done.length?sh('Synthesized — in your brain','<span class="link" data-view="notes">All notes</span>')+'<div class="feed">'+done.map(noteCard).join('')+'</div>':''}
    ${!vids.length?emptyLearn():''}`;
  wireYT();
}
function ytCard(n){
  const ready=n.transcript&&n.transcript.trim();
  return `<div class="note t-youtube" data-yt="${n.id}">
    <div class="note-top"><span class="note-type" style="background:rgba(244,63,94,.12);color:var(--yt)">${I.play}</span>
      <span class="note-title">${esc(n.title)}</span>
      <span class="status ${ready?'active':''}">${ready?'Ready':'Needs transcript'}</span></div>
    <div class="note-host">${I.play}${esc(host(n.url))}</div></div>`;
}
function emptyLearn(){return`<div class="empty">${I.play}<h3>Feed your brain</h3><p>Paste a YouTube video or playlist above. Nexus distills each one into an expert synthesis you can search and connect.</p></div>`}
function wireYT(){
  const ta=$('#yt-in'),btn=$('#yt-save');if(!ta)return;
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px';btn.disabled=!ta.value.trim()};
  ta.addEventListener('input',grow);
  const add=()=>{
    const r=extractYT(ta.value);let n=0;r.vids.forEach(id=>{if(addYT(id))n++});save();
    ta.value='';grow();render();
    if(n)toast(n+' video'+(n>1?'s':'')+' queued');
    else if(r.lists.length)toast('Playlist link saved — paste its video URLs to synthesize (or set up the YouTube API, see briefing)');
    else toast('No YouTube video links found');
  };
  btn.addEventListener('click',add);
  ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();add()}});
}
function openYT(id){
  const n=state.notes.find(x=>x.id===id);if(!n)return;
  const st=n.status==='done'?'Synthesized ✓':(n.transcript&&n.transcript.trim()?'Ready to synthesize':'Awaiting transcript');
  openModal(`<div class="modal" style="max-width:620px">
    <div class="modal-head"><span class="mtype" style="background:rgba(244,63,94,.12);color:var(--yt)">${I.play}</span>
      <input id="yt-title" value="${esc(n.title)}"/>
      <button class="modal-x" data-action="close-modal">${I.close}</button></div>
    <div class="modal-body">
      <a class="modal-link" style="background:rgba(244,63,94,.1);color:var(--yt)" href="${esc(n.url)}" target="_blank" rel="noopener">${I.play}${esc(n.url)}</a>
      ${n.status==='done'?`<div style="font-size:14.5px;line-height:1.65;white-space:pre-wrap">${esc(n.content)}</div>`:`
      <div class="field"><label>Transcript — open the video, “…” → Show transcript → copy, paste here</label>
        <textarea id="yt-tr" style="min-height:150px;width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:13.5px;line-height:1.6;color:var(--text);outline:none" placeholder="Paste the transcript so Nexus can synthesize the real content…">${esc(n.transcript||'')}</textarea></div>
      <p style="font-size:12.5px;color:var(--muted)">Then Export the queue (Settings or the Learn page) → your agent writes the synthesis → Import it back.</p>`}
    </div>
    <div class="modal-foot"><span class="meta">Status: ${st}</span>
      <button class="btn-ghost danger" data-action="del-note" data-id="${id}">Remove</button>
      ${n.status==='done'?'':`<button class="btn-solid" data-action="save-yt" data-id="${id}">Save</button>`}
    </div></div>`);
}
function importSyntheses(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;
      const lp=getLearnProject();let n=0;
      arr.forEach(s=>{if(!s||!s.synthesis)return;
        let note=s.videoId&&state.notes.find(x=>x.videoId===s.videoId&&x.type==='youtube');
        if(note){note.content=s.synthesis;if(s.title)note.title=s.title;note.status='done';
          if(s.tags)note.tags=[...new Set([...note.tags,...s.tags])];note.updatedAt=Date.now();}
        else{state.notes.unshift({id:uid(),type:'youtube',videoId:s.videoId||'',url:s.url||'',
          title:s.title||'Synthesis',content:s.synthesis,transcript:'',status:'done',
          tags:[...new Set(['youtube',...(s.tags||[])])],projectId:lp.id,createdAt:Date.now(),updatedAt:Date.now()});}
        n++;});
      save();render();toast(n?n+' synthesis'+(n>1?'es':'')+' ingested':'Nothing to import');
    }catch(e){toast('Invalid syntheses file')}};
    r.readAsText(f)};inp.click();
}
function exportQueue(){
  const q=state.notes.filter(n=>n.type==='youtube').map(n=>({videoId:n.videoId,url:n.url,title:n.title,transcript:n.transcript||'',status:n.status}));
  if(!q.length)return toast('Queue is empty');
  const blob=new Blob([JSON.stringify(q,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='nexus-youtube-queue-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Queue exported');
}

/* --------- pieces --------- */
function captureHTML(projId){
  return `<div class="capture" id="capture">
    <textarea id="cap-in" rows="1" placeholder="Save a thought… paste a link, add #tags"></textarea>
    <div class="capture-bar">
      <div class="hint">${I.bolt}<span>⌘↵ to save</span></div>
      <div class="chip-select" data-action="pick-proj" data-forproj="${projId||''}">
        <span class="dot" id="cap-proj-dot" style="background:var(--muted)"></span>
        <span id="cap-proj-label">No project</span>
      </div>
      <button class="icon-btn" title="Voice (coming soon)" data-action="mic">${I.mic}</button>
      <button class="save-btn" id="cap-save" disabled>Save</button>
    </div>
  </div>`;
}
function noteCard(n){
  const p=projById(n.projectId);
  return `<div class="note t-${n.type}" data-note="${n.id}">
    <div class="note-top">
      <span class="note-type" style="background:${typeColor(n.type)}1f;color:${typeColor(n.type)}">${noteIcon(n.type)}</span>
      <span class="note-title">${esc(n.title)}</span>
      <span class="note-time tnum">${timeAgo(n.createdAt)}</span>
    </div>
    ${n.type==='link'?`<div class="note-host">${I.link}${esc(host(n.url))}</div>`:''}
    ${summarize(n)?`<p class="note-summary">${esc(summarize(n))}</p>`:''}
    <div class="note-foot">
      ${n.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
      ${p?`<span class="note-proj"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span>`:''}
    </div>
  </div>`;
}
function emptyNotes(){return`<div class="empty">${I.note}<h3>Nothing here yet</h3><p>Capture your first thought above — a link, an idea, anything. Nexus remembers it for you.</p></div>`}

/* ------------------------------------------------------------------ capture wiring */
function wireCapture(){
  const box=$('#capture');if(!box)return;
  const ta=$('#cap-in'),saveBtn=$('#cap-save');
  const forproj=box.querySelector('[data-forproj]').dataset.forproj;
  if(forproj){ui.capProj=forproj;paintCapProj()}else{paintCapProj()}
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,220)+'px';saveBtn.disabled=!ta.value.trim()};
  ta.addEventListener('input',grow);
  ta.addEventListener('focus',()=>box.classList.add('focus'));
  ta.addEventListener('blur',()=>box.classList.remove('focus'));
  ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();doSave()}});
  saveBtn.addEventListener('click',doSave);
  function doSave(){const n=addNote(ta.value);if(n){ta.value='';grow();toast('Saved to your brain');render();wireCapture()}}
}
function paintCapProj(){
  const dot=$('#cap-proj-dot'),lbl=$('#cap-proj-label');if(!dot)return;
  const p=projById(ui.capProj);
  if(p){dot.style.background=p.color;lbl.textContent=p.name}
  else{dot.style.background='var(--muted)';lbl.textContent='No project'}
}

/* ------------------------------------------------------------------ menus */
function projMenu(anchor){
  closeMenus();
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=`<div class="menu-item" data-pick=""><span class="dot" style="background:var(--muted)"></span>No project</div>`+
    state.projects.map(p=>`<div class="menu-item" data-pick="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</div>`).join('');
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  m.style.top=(r.bottom+6+window.scrollY)+'px';
  m.style.left=Math.min(r.left,window.innerWidth-210)+'px';
  m.addEventListener('click',e=>{const it=e.target.closest('[data-pick]');if(!it)return;
    ui.capProj=it.dataset.pick||null;paintCapProj();closeMenus()});
}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove())}

/* ------------------------------------------------------------------ modals */
const modalOv=$('#modal-ov'),modalMount=$('#modal-mount');
function openModal(html){modalMount.innerHTML=html;modalOv.classList.add('open')}
function closeModal(){modalOv.classList.remove('open');modalMount.innerHTML=''}

function openNote(id){
  const n=state.notes.find(x=>x.id===id);if(!n)return;
  const p=projById(n.projectId);const tc=typeColor(n.type);
  openModal(`<div class="modal" data-editing="${id}">
    <div class="modal-head">
      <span class="mtype" style="background:${tc}1f;color:${tc}">${noteIcon(n.type)}</span>
      <input id="m-title" value="${esc(n.title)}"/>
      <button class="modal-x" data-action="close-modal">${I.close}</button>
    </div>
    <div class="modal-body">
      ${n.url?`<a class="modal-link" href="${esc(n.url)}" target="_blank" rel="noopener">${I.link}${esc(n.url)}</a>`:''}
      <textarea id="m-content" placeholder="Write your thoughts…">${esc(n.content)}</textarea>
      <div class="meta-grid">
        ${n.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
        ${p?`<span class="note-proj"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span>`:''}
      </div>
    </div>
    <div class="modal-foot">
      <span class="meta">Saved ${timeAgo(n.createdAt)}${n.updatedAt-n.createdAt>6e4?' · edited '+timeAgo(n.updatedAt):''}</span>
      <button class="btn-ghost danger" data-action="del-note" data-id="${id}">Delete</button>
      <button class="btn-solid" data-action="save-note" data-id="${id}">Save</button>
    </div>
  </div>`);
  $('#m-content').style.height=Math.max(160,$('#m-content').scrollHeight)+'px';
}

function openNewProject(){
  let color=PC[0];
  openModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><span class="mtype" style="background:var(--accent-soft);color:var(--accent-2)">${I.folder}</span>
      <h2>New project</h2><button class="modal-x" data-action="close-modal">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input id="np-name" placeholder="e.g. First client — construction co" autofocus/></div>
      <div class="field"><label>Color</label><div class="swatches" id="np-sw">
        ${PC.map((c,i)=>`<div class="swatch ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></div>`).join('')}
      </div></div>
    </div>
    <div class="modal-foot"><span class="meta"></span>
      <button class="btn-ghost" data-action="close-modal">Cancel</button>
      <button class="btn-solid" id="np-create">Create project</button>
    </div>
  </div>`);
  $('#np-sw').addEventListener('click',e=>{const s=e.target.closest('.swatch');if(!s)return;
    color=s.dataset.c;$('#np-sw').querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));s.classList.add('sel')});
  const create=()=>{const v=$('#np-name').value.trim();if(!v)return;const p=addProject(v,color);closeModal();ui.view='project';ui.proj=p.id;ui.tag=null;render();toast('Project created')};
  $('#np-create').addEventListener('click',create);
  $('#np-name').addEventListener('keydown',e=>{if(e.key==='Enter')create()});
  setTimeout(()=>$('#np-name').focus(),50);
}

/* ------------------------------------------------------------------ command palette */
const palOv=$('#palette-ov'),palQ=$('#pal-q'),palRes=$('#pal-results');
function openPalette(){palOv.classList.add('open');palQ.value='';ui.palSel=0;runSearch('');setTimeout(()=>palQ.focus(),40)}
function closePalette(){palOv.classList.remove('open')}
function runSearch(q){
  q=q.trim().toLowerCase();
  let notes=state.notes,projs=state.projects,tags=allTags().map(t=>t[0]);
  if(q){
    notes=notes.filter(n=>(n.title+' '+n.content+' '+n.tags.join(' ')+' '+n.url).toLowerCase().includes(q));
    projs=projs.filter(p=>p.name.toLowerCase().includes(q));
    tags=tags.filter(t=>t.includes(q));
  }
  notes=notes.slice(0,7);projs=projs.slice(0,4);tags=tags.slice(0,5);
  const items=[];
  projs.forEach(p=>items.push({k:'proj',id:p.id,l1:p.name,l2:state.notes.filter(n=>n.projectId===p.id).length+' notes',ic:I.folder,color:p.color}));
  tags.forEach(t=>items.push({k:'tag',id:t,l1:'#'+t,l2:'tag',ic:I.hash}));
  notes.forEach(n=>items.push({k:'note',id:n.id,l1:n.title,l2:(n.type==='link'?host(n.url):summarize(n).slice(0,60))||'note',ic:noteIcon(n.type)}));
  ui.palItems=items;if(ui.palSel>=items.length)ui.palSel=0;
  let html='';
  if(!items.length){html=`<div class="pal-empty">No matches for “${esc(q)}”.<br><span style="font-size:12.5px">Press ↵ to capture it as a new note.</span></div>`}
  else{
    const grp=(name,arr)=>arr.length?`<div class="pal-group">${name}</div>`+arr.map(renderPalItem).join(''):'';
    html=grp('Projects',items.filter(i=>i.k==='proj'))+grp('Tags',items.filter(i=>i.k==='tag'))+grp('Notes',items.filter(i=>i.k==='note'));
  }
  palRes.innerHTML=html;highlightPal();
}
function renderPalItem(it){const idx=ui.palItems.indexOf(it);
  return `<div class="pal-item ${idx===ui.palSel?'sel':''}" data-pal="${idx}">
    <span class="pic" ${it.color?`style="color:${it.color}"`:''}>${it.ic}</span>
    <span class="pt"><span class="l1">${esc(it.l1)}</span><span class="l2">${esc(it.l2)}</span></span></div>`;
}
function highlightPal(){palRes.querySelectorAll('.pal-item').forEach(el=>el.classList.toggle('sel',+el.dataset.pal===ui.palSel));
  const sel=palRes.querySelector('.pal-item.sel');if(sel)sel.scrollIntoView({block:'nearest'})}
function palOpen(idx){
  const it=ui.palItems[idx];
  if(!it){const q=palQ.value.trim();if(q){ui.capType='text';const n=addNote(q);closePalette();render();toast('Captured');if(n)openNote(n.id)}return}
  closePalette();ui.tag=null;
  if(it.k==='note'){openNote(it.id)}
  else if(it.k==='proj'){ui.view='project';ui.proj=it.id;render()}
  else if(it.k==='tag'){ui.tag=it.id;render()}
}

/* ------------------------------------------------------------------ toast */
let toastT;
function toast(msg){const t=$('#toast');$('#toast-msg').textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ------------------------------------------------------------------ data io */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='nexus-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.notes){state=d;save();ui.view='home';render();toast('Backup restored')}else toast('Invalid file')}catch(e){toast('Could not read file')}};
    r.readAsText(f)};inp.click()}
function clearData(){if(confirm('Delete ALL notes and projects? This cannot be undone.')){state={notes:[],projects:[],settings:{},meta:{created:Date.now()}};save();ui.view='home';render();toast('Everything cleared')}}

/* ------------------------------------------------------------------ events */
document.addEventListener('click',e=>{
  const t=e.target;
  const A=t.closest('[data-action]');
  const view=t.closest('[data-view]');
  const note=t.closest('[data-note]');
  const ytc=t.closest('[data-yt]');
  const proj=t.closest('[data-proj]');
  const tag=t.closest('[data-tag]');
  const filter=t.closest('[data-filter]');
  const palItem=t.closest('[data-pal]');
  if(!t.closest('.menu')&&!t.closest('[data-action="pick-proj"]'))closeMenus();

  if(palItem){palOpen(+palItem.dataset.pal);return}
  if(A){const a=A.dataset.action;
    if(a==='search')openPalette();
    else if(a==='focus-capture'){closeSidebar();const c=$('#cap-in');if(c){c.focus();c.scrollIntoView({block:'center',behavior:'smooth'})}}
    else if(a==='pick-proj')projMenu(A);
    else if(a==='mic')toast('Voice capture is coming soon');
    else if(a==='new-project')openNewProject();
    else if(a==='close-modal')closeModal();
    else if(a==='del-note'){deleteNote(A.dataset.id);closeModal();render();toast('Note deleted')}
    else if(a==='save-note'){updateNote(A.dataset.id,{title:$('#m-title').value.trim()||'Untitled',content:$('#m-content').value});closeModal();render();toast('Saved')}
    else if(a==='save-yt'){const nn=state.notes.find(x=>x.id===A.dataset.id);const tr=$('#yt-tr').value;const ti=$('#yt-title').value.trim()||nn.title;updateNote(A.dataset.id,{title:ti,transcript:tr,status:nn.status==='done'?'done':(tr.trim()?'ready':'pending')});closeModal();render();toast('Saved')}
    else if(a==='yt-export')exportQueue();
    else if(a==='yt-import')importSyntheses();
    else if(a==='export')exportData();
    else if(a==='import')importData();
    else if(a==='clear')clearData();
    else if(a==='open-sidebar')openSidebar();
    else if(a==='close-sidebar')closeSidebar();
    return;}
  if(ytc){openYT(ytc.dataset.yt);return}
  if(note){openNote(note.dataset.note);return}
  if(proj){ui.view='project';ui.proj=proj.dataset.proj;ui.tag=null;render();return}
  if(tag){ui.tag=tag.dataset.tag;ui.view='';render();closeSidebar();return}
  if(filter){ui.filter=filter.dataset.filter;render();return}
  if(view){ui.view=view.dataset.view;ui.tag=null;ui.proj=null;if(ui.view==='notes')ui.filter='all';render();closeSidebar();return}
});
modalOv.addEventListener('click',e=>{if(e.target===modalOv)closeModal()});
palOv.addEventListener('click',e=>{if(e.target===palOv)closePalette()});
palQ.addEventListener('input',()=>{ui.palSel=0;runSearch(palQ.value)});
palQ.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();ui.palSel=Math.min(ui.palSel+1,ui.palItems.length-1);highlightPal()}
  else if(e.key==='ArrowUp'){e.preventDefault();ui.palSel=Math.max(ui.palSel-1,0);highlightPal()}
  else if(e.key==='Enter'){e.preventDefault();palOpen(ui.palSel)}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOv.classList.contains('open')?closePalette():openPalette()}
  else if(e.key==='Escape'){closeMenus();if(palOv.classList.contains('open'))closePalette();else if(modalOv.classList.contains('open'))closeModal();else closeSidebar()}
});
function openSidebar(){$('#sidebar').classList.add('open');$('#scrim').classList.add('open')}
function closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open')}

/* mount icons */
setIcon('ic-logo','logo');setIcon('ic-s1','search');setIcon('ic-s2','search');setIcon('ic-s3','search');
setIcon('ic-plus','plus');setIcon('ic-set','set');setIcon('ic-menu','menu');setIcon('ic-check','check');

/* re-wire capture after every render */
const _render=render;
render=function(){_render();wireCapture();};
render();
</script>
