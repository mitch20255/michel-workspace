<title>Météo Papa</title>
<style>
  /* Single, deliberately bright cartoon world — painted explicitly so it
     holds on any host ground, no theme inversion wanted here. */
  :root {
    --sky-top:    #7DD3FC;
    --sky-bottom: #BAE6FD;
    --sun:        #FBBF24;
    --sun-deep:   #FB923C;
    --cloud:      #FFFFFF;
    --cloud-sh:   #DBEAFE;
    --hug:        #FB7185;
    --ink:        #0F2A47;
    --floor:      #FCE7C3;
    --floor-sh:   #F4D19A;
    --wall:       #A5D8F3;
    --panel:      rgba(255,255,255,0.82);
    --stage-w: min(94vw, calc(88vh * 16 / 9));
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -10%, #E0F5FF 0%, #9CCDE8 60%, #6DAFCF 100%);
    display: grid;
    place-items: center;
    min-height: 100%;
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    padding: 3vh 0;
  }

  .frame {
    width: var(--stage-w);
    aspect-ratio: 16 / 9;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 30px 60px -20px rgba(15,42,71,.5),
      0 0 0 6px rgba(255,255,255,.6),
      0 0 0 8px rgba(15,42,71,.08);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  }

  /* The camera: everything inside zooms in slowly over the 10s cycle. */
  .stage {
    position: absolute;
    inset: 0;
    transform-origin: 54% 60%;
    animation: camera 10s cubic-bezier(.34,.02,.3,1) infinite;
  }
  @keyframes camera {
    0%   { transform: scale(1.0); }
    92%  { transform: scale(1.20); }
    100% { transform: scale(1.20); }
  }

  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Sun: gentle pulse + slowly rotating rays */
  .sun-core { transform-origin: 760px 150px; animation: sunPulse 3.4s ease-in-out infinite; }
  .sun-rays { transform-origin: 760px 150px; animation: sunSpin 18s linear infinite; }
  @keyframes sunPulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.06);} }
  @keyframes sunSpin  { to { transform: rotate(360deg); } }

  .cloud-a { animation: driftA 9s ease-in-out infinite; }
  .cloud-b { animation: driftB 11s ease-in-out infinite; }
  @keyframes driftA { 0%,100%{ transform: translateX(0);} 50%{ transform: translateX(26px);} }
  @keyframes driftB { 0%,100%{ transform: translateX(0);} 50%{ transform: translateX(-22px);} }

  /* Little floating weather pins over the room */
  .pin { transform-box: fill-box; transform-origin: center; }
  .pin-1 { animation: bob 3.2s ease-in-out infinite; }
  .pin-2 { animation: bob 3.8s ease-in-out .4s infinite; }
  .pin-3 { animation: bob 3.5s ease-in-out .8s infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-10px);} }

  /* ---- Text overlay -------------------------------------------------- */
  .overlay {
    position: absolute;
    left: 50%;
    bottom: 8.5%;
    transform: translateX(-50%);
    width: 84%;
    display: grid;
    place-items: center;
    text-align: center;
    pointer-events: none;
  }
  .card {
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(2px);
    border-radius: 20px;
    padding: clamp(10px, 2.4vw, 26px) clamp(16px, 3.4vw, 40px);
    box-shadow: 0 14px 30px -12px rgba(15,42,71,.45), inset 0 0 0 2px rgba(255,255,255,.7);
  }
  .line {
    grid-area: 1 / 1;
    margin: 0;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.015em;
    font-size: clamp(20px, 4.4vw, 58px);
    text-shadow: 0 2px 0 rgba(255,255,255,.6);
    opacity: 0;
  }
  .card { display: grid; }
  .line-1 { color: var(--ink);  animation: showBounce 10s both infinite; }
  .line-2 { color: var(--hug);  animation: showBounce2 10s both infinite; }

  /* Phase 1 visible ~0.4s–5s, phase 2 visible ~5.4s–9.6s */
  @keyframes showBounce {
    0%   { opacity: 0; transform: translateY(40px) scale(.7); }
    5%   { opacity: 1; transform: translateY(-8px) scale(1.06); }
    8%   { transform: translateY(4px) scale(.98); }
    11%  { transform: translateY(0)  scale(1); }
    46%  { opacity: 1; transform: translateY(0) scale(1); }
    50%  { opacity: 0; transform: translateY(-26px) scale(.9); }
    100% { opacity: 0; transform: translateY(-26px) scale(.9); }
  }
  @keyframes showBounce2 {
    0%   { opacity: 0; transform: translateY(40px) scale(.7); }
    50%  { opacity: 0; transform: translateY(40px) scale(.7); }
    55%  { opacity: 1; transform: translateY(-8px) scale(1.06); }
    58%  { transform: translateY(4px) scale(.98); }
    61%  { opacity: 1; transform: translateY(0) scale(1); }
    95%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(.98); }
  }

  /* TV-style weather clock badge */
  .badge {
    position: absolute;
    top: 6%; left: 5%;
    background: rgba(255,255,255,.85);
    color: var(--ink);
    font-weight: 800;
    font-size: clamp(9px, 1.5vw, 16px);
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: .5em .9em;
    border-radius: 999px;
    box-shadow: 0 8px 18px -10px rgba(15,42,71,.5), inset 0 0 0 2px rgba(255,255,255,.7);
  }

  .toolbar {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    color: #0F2A47;
  }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    padding: .55em 1.1em;
    background: #0F2A47;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 16px -8px rgba(15,42,71,.6);
  }
  button:focus-visible { outline: 3px solid var(--hug); outline-offset: 2px; }
  .hint { font-size: 13px; opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    .stage, .sun-core, .sun-rays, .cloud-a, .cloud-b, .pin-1, .pin-2, .pin-3 { animation: none; }
    .line-1 { opacity: 1; }
    .line-2 { opacity: 0; }
  }
</style>

<div class="frame">
  <div class="stage" id="stage">
    <svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- Sky -->
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7DD3FC"/>
          <stop offset="1" stop-color="#BAE6FD"/>
        </linearGradient>
        <radialGradient id="sunG" cx="0.5" cy="0.45" r="0.6">
          <stop offset="0" stop-color="#FEF08A"/>
          <stop offset="0.6" stop-color="#FBBF24"/>
          <stop offset="1" stop-color="#FB923C"/>
        </radialGradient>
        <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FCE7C3"/>
          <stop offset="1" stop-color="#F4D19A"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="960" height="540" fill="url(#sky)"/>

      <!-- Room: back wall + floor, the "map" surface -->
      <rect x="0" y="330" width="960" height="210" fill="url(#floorG)"/>
      <path d="M0 330 L960 330 L960 350 L0 350 Z" fill="#EBBE77" opacity=".5"/>

      <!-- Rug -->
      <ellipse cx="470" cy="452" rx="250" ry="52" fill="#FBCFE8" opacity=".7"/>
      <ellipse cx="470" cy="452" rx="180" ry="36" fill="#F9A8D4" opacity=".55"/>

      <!-- Cozy armchair (dad's spot) -->
      <g>
        <rect x="360" y="300" width="220" height="150" rx="34" fill="#60A5FA"/>
        <rect x="360" y="300" width="220" height="70" rx="30" fill="#93C5FD"/>
        <rect x="342" y="330" width="46" height="120" rx="22" fill="#3B82F6"/>
        <rect x="552" y="330" width="46" height="120" rx="22" fill="#3B82F6"/>
        <rect x="405" y="360" width="130" height="70" rx="16" fill="#BFDBFE"/>
        <!-- sleepy Zzz over the chair -->
        <text x="600" y="315" font-family="system-ui" font-weight="900" font-size="34" fill="#3B82F6" opacity=".9">z</text>
        <text x="628" y="298" font-family="system-ui" font-weight="900" font-size="26" fill="#60A5FA" opacity=".8">z</text>
        <text x="650" y="286" font-family="system-ui" font-weight="900" font-size="18" fill="#93C5FD" opacity=".7">z</text>
      </g>

      <!-- Side table + lamp -->
      <g>
        <rect x="150" y="360" width="86" height="90" rx="10" fill="#D9A066"/>
        <rect x="150" y="356" width="86" height="14" rx="6" fill="#C58A4E"/>
        <rect x="182" y="300" width="22" height="60" fill="#B7854F"/>
        <path d="M160 300 Q193 250 226 300 Z" fill="#FDE68A"/>
      </g>

      <!-- Plant -->
      <g>
        <rect x="740" y="392" width="70" height="58" rx="10" fill="#F97316"/>
        <path d="M775 392 C740 340 760 300 776 300 C792 300 812 340 775 392 Z" fill="#34D399"/>
        <path d="M775 392 C800 350 830 340 838 356 C846 372 812 388 775 392 Z" fill="#10B981"/>
        <path d="M775 392 C750 356 720 348 712 364 C704 380 738 390 775 392 Z" fill="#10B981"/>
      </g>

      <!-- Window with weather beyond -->
      <g>
        <rect x="70" y="120" width="150" height="130" rx="10" fill="#BAE6FD" stroke="#93C5FD" stroke-width="6"/>
        <line x1="145" y1="120" x2="145" y2="250" stroke="#93C5FD" stroke-width="5"/>
        <line x1="70" y1="185" x2="220" y2="185" stroke="#93C5FD" stroke-width="5"/>
      </g>

      <!-- SUN -->
      <g>
        <g class="sun-rays">
          <g fill="var(--sun)">
            <rect x="752" y="60" width="16" height="40" rx="8"/>
            <rect x="752" y="200" width="16" height="40" rx="8"/>
            <rect x="670" y="142" width="40" height="16" rx="8"/>
            <rect x="810" y="142" width="40" height="16" rx="8"/>
            <rect x="690" y="85" width="16" height="40" rx="8" transform="rotate(45 698 105)"/>
            <rect x="820" y="85" width="16" height="40" rx="8" transform="rotate(-45 828 105)"/>
            <rect x="690" y="175" width="16" height="40" rx="8" transform="rotate(-45 698 195)"/>
            <rect x="820" y="175" width="16" height="40" rx="8" transform="rotate(45 828 195)"/>
          </g>
        </g>
        <g class="sun-core">
          <circle cx="760" cy="150" r="58" fill="url(#sunG)"/>
          <circle cx="742" cy="140" r="7" fill="#7C3A12"/>
          <circle cx="778" cy="140" r="7" fill="#7C3A12"/>
          <path d="M742 166 Q760 184 778 166" stroke="#7C3A12" stroke-width="7" fill="none" stroke-linecap="round"/>
          <circle cx="730" cy="158" r="9" fill="#FDA4AF" opacity=".7"/>
          <circle cx="790" cy="158" r="9" fill="#FDA4AF" opacity=".7"/>
        </g>
      </g>

      <!-- CLOUDS -->
      <g class="cloud-a">
        <g fill="var(--cloud)">
          <ellipse cx="360" cy="120" rx="60" ry="42"/>
          <ellipse cx="410" cy="108" rx="52" ry="46"/>
          <ellipse cx="452" cy="128" rx="46" ry="38"/>
          <rect x="352" y="120" width="112" height="40" rx="20"/>
        </g>
        <ellipse cx="405" cy="150" rx="76" ry="12" fill="var(--cloud-sh)" opacity=".6"/>
      </g>
      <g class="cloud-b">
        <g fill="var(--cloud)">
          <ellipse cx="560" cy="80" rx="40" ry="30"/>
          <ellipse cx="596" cy="70" rx="34" ry="30"/>
          <rect x="556" y="78" width="76" height="26" rx="13"/>
        </g>
      </g>

      <!-- Floating weather pins (map markers) -->
      <g class="pin pin-1" transform="translate(250,250)">
        <path d="M0 0 C-26 -26 -26 -58 0 -58 C26 -58 26 -26 0 0 Z" fill="#FB7185"/>
        <circle cx="0" cy="-36" r="15" fill="#fff"/>
        <text x="0" y="-30" text-anchor="middle" font-size="18">☀️</text>
      </g>
      <g class="pin pin-2" transform="translate(640,300)">
        <path d="M0 0 C-26 -26 -26 -58 0 -58 C26 -58 26 -26 0 0 Z" fill="#60A5FA"/>
        <circle cx="0" cy="-36" r="15" fill="#fff"/>
        <text x="0" y="-30" text-anchor="middle" font-size="18">🌤️</text>
      </g>
      <g class="pin pin-3" transform="translate(470,235)">
        <path d="M0 0 C-24 -24 -24 -54 0 -54 C24 -54 24 -24 0 0 Z" fill="#F59E0B"/>
        <circle cx="0" cy="-34" r="14" fill="#fff"/>
        <text x="0" y="-28" text-anchor="middle" font-size="16">💛</text>
      </g>
    </svg>

    <div class="badge">Bulletin · Maison · 14 h</div>

    <div class="overlay">
      <div class="card">
        <p class="line line-1">Aujourd'hui : 100&nbsp;% de chances d'ennui de papa</p>
        <p class="line line-2">Rafales de câlins prévues bientôt 🌤️</p>
      </div>
    </div>
  </div>
</div>

<div class="toolbar">
  <button id="replay" type="button">↻ Rejouer les 10 s</button>
  <span class="hint">Astuce : enregistre l'écran pendant un cycle pour obtenir ta vidéo de 10 s.</span>
</div>

<script>
  // Restart every animation in the stage together, so a screen-recording
  // can capture a clean single 10s cycle on demand.
  const replay = document.getElementById('replay');
  replay.addEventListener('click', () => {
    const anims = document.getAnimations ? document.getAnimations() : [];
    anims.forEach(a => { a.currentTime = 0; });
  });
</script>
