<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Réseau social papa & fille, Montréal</title>
<style>
  :root{
    --bg:#0d0d12;
    --card:#16161d;
    --accent:#ff5c8a;
    --accent2:#4fd1c5;
    --text:#f5f5f7;
    --muted:#9a9aa5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #scroller{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #scroller::-webkit-scrollbar{display:none;}
  .card{
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:24px;
    position:relative;
  }
  .panel{
    width:100%;
    max-width:520px;
    background:linear-gradient(160deg, var(--card), #1c1c26);
    border-radius:20px;
    padding:28px 24px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.06);
  }
  .badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--bg);
    background:var(--accent2);
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .platform{
    display:inline-block;
    font-size:12px;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.15);
    padding:3px 9px;
    border-radius:999px;
    margin-left:6px;
  }
  h1{font-size:22px;margin:8px 0 6px;line-height:1.25;}
  p.desc{font-size:15px;line-height:1.5;color:#d8d8df;margin:0 0 16px;}
  .unverified{color:#ffb86b;font-size:13px;margin:0 0 14px;}
  a.linkbtn{
    display:inline-block;
    background:var(--accent);
    color:#1a0a10;
    font-weight:700;
    text-decoration:none;
    padding:10px 18px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:18px;
  }
  textarea.notes{
    width:100%;
    min-height:70px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    color:var(--text);
    font-size:14px;
    padding:10px;
    resize:vertical;
    font-family:inherit;
  }
  textarea.notes::placeholder{color:var(--muted);}
  .label-notes{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;display:block;}
  #progress{
    position:fixed;
    top:14px;right:18px;
    font-size:13px;
    color:var(--muted);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:999px;
    z-index:10;
  }
  #hint{
    position:fixed;
    bottom:10px;left:0;right:0;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    z-index:10;
  }
  #catbar{
    position:fixed;
    top:14px;left:18px;
    font-size:12px;
    color:var(--accent2);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:999px;
    z-index:10;
    max-width:55%;
  }
</style>
</head>
<body>
<div id="catbar">—</div>
<div id="progress">0 / 0</div>
<div id="scroller"></div>
<div id="hint">↓ scroll / swipe pour la suivante · tes notes se sauvegardent automatiquement</div>

{cat:"Hochelaga", name:"Interaction Famille Hochelaga-Maisonneuve", platform:"Organisme", link:"http://interactionfamille.ca/", desc:"Organisme avec plusieurs services pour familles du quartier."},

{cat:"Meetup", name:"Tous les groupes Parents/Famille à Montréal", platform:"Meetup (catégorie)", link:"https://www.meetup.com/cities/ca/qc/montr%C3%A9al/parents-family/", desc:"Liste complète et évolutive de tous les groupes parents/famille sur Meetup à Montréal — à revisiter régulièrement, de nouveaux groupes apparaissent."},

{cat:"Instagram", name:"Top 10 influenceurs parents Québec", platform:"Article (liste)", link:"https://madein.co/blogue/influence/10-influenceurs-parents-au-quebec-sur-instagram/", desc:"Liste de comptes Instagram de parents québécois, dont un compte 'papa cool' avec humour.", unverified:"Plus pour l'inspiration de contenu que pour réseauter en vrai."},

{cat:"Apps Amis", name:"4 apps pour se faire des amis à Montréal", platform:"Article (liste)", link:"https://mauditsfrancais.ca/4-applications-pour-se-faire-des-amis-a-montreal/", desc:"Article source qui mentionne Together Club, Frimake, Groupevibe et Timeleft — apps d'événements/soupers pour rencontrer du monde à Montréal.", unverified:"⚠️ Liens directs de ces 4 apps non confirmés individuellement — passe par cet article pour les trouver, je ne veux pas te donner une URL inventée."},
{cat:"Apps Amis", name:"We3", platform:"App mobile (mention)", link:"https://www.orientaction-groupe.com/meilleures-plateformes-tisser-amities-durables-ligne-web-internet-sites-bumble-bff-meetup-reddit-diversite-culturelle-benefices/", desc:"Forme des groupes de 3 personnes via un questionnaire de ~150 critères/valeurs, visée amitié durable plutôt que ponctuelle.", unverified:"Lien direct vers l'app non confirmé — voir l'article source pour le nom exact à chercher sur ton store d'applications."},
{cat:"Apps Amis", name:"Meetup (général)", platform:"App / Site", link:"https://www.meetup.com/find/ca--montreal/", desc:"Moins ciblé Montréal nativement mais a des groupes par intérêt (rando, jeux de société, réseautage) actifs dans la ville — bon complément aux groupes parents."},

];

const scroller = document.getElementById("scroller");
const progress = document.getElementById("progress");
const catbar = document.getElementById("catbar");
const STORAGE_KEY = "papa_dashboard_notes_v1";
let notesStore = {};
try { notesStore = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch(e) { notesStore = {}; }

function saveNote(id, value){
  notesStore[id] = value;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notesStore));
}

DATA.forEach((item, i) => {
  const id = "card_" + i;
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.index = i;
  card.dataset.cat = item.cat;

  const unverifiedHtml = item.unverified
    ? `<p class="unverified">⚠️ ${item.unverified}</p>`
    : "";

  card.innerHTML = `
    <div class="panel">
      <span class="badge">${item.cat}</span>
      <span class="platform">${item.platform}</span>
      <h1>${item.name}</h1>
      <p class="desc">${item.desc}</p>
      ${unverifiedHtml}
      <a class="linkbtn" href="${item.link}" target="_blank" rel="noopener noreferrer">Ouvrir le lien ↗</a>
      <span class="label-notes">Mes notes</span>
      <textarea class="notes" id="${id}" placeholder="Ex: contacté le ___ / pas répondu / ambiance sympa / à éviter...">${notesStore[id] || ""}</textarea>
    </div>
  `;
  scroller.appendChild(card);

  card.querySelector("textarea").addEventListener("input", (e) => {
    saveNote(id, e.target.value);
  });
});

function updateHud(){
  const cards = Array.from(document.querySelectorAll(".card"));
  const mid = window.scrollY !== undefined ? scroller.scrollTop + scroller.clientHeight/2 : 0;
  let current = 0;
  cards.forEach((c, i) => {
    if (c.offsetTop <= mid) current = i;
  });
  progress.textContent = (current+1) + " / " + cards.length;
  catbar.textContent = DATA[current].cat;
}

scroller.addEventListener("scroll", () => {
  window.requestAnimationFrame(updateHud);
});
updateHud();
</script>
</body>
</html>
